<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garden test</title>
<meta name="robots" content="noindex">
<script src="garden.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#000000; --text:#e6e6e6; --muted:#8c8c8c; --dim:#555555; --line:#3a3a3a;
  --inv-bg:#e6e6e6; --inv-text:#000000;
  --mono:"SF Mono", ui-monospace, Menlo, "Cascadia Mono", Consolas, "Liberation Mono", monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--mono);text-shadow:0 0 6px rgba(230,230,230,.28)}
.wrap{max-width:1000px;margin:0 auto;
  padding:max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 60px max(18px, env(safe-area-inset-left))}
h1{font-size:1.35rem;margin:0 0 4px;letter-spacing:.06em}
h2{font-size:1rem;margin:28px 0 10px}
p{margin:0 0 12px;color:var(--muted)}
a{color:var(--text)}
button,input{font:inherit;color:inherit}
button{background:none;border:2px solid var(--text);border-radius:0;padding:6px 12px;cursor:pointer;touch-action:manipulation}
button.primary{background:var(--inv-bg);color:var(--inv-text);border-color:var(--inv-bg);text-shadow:none;font-weight:700}
:focus-visible{outline:2px dashed var(--text);outline-offset:3px}
canvas{display:block;width:100%;height:auto;background:#000;border:1px solid var(--line);
  image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges;image-rendering:pixelated}
.live{max-width:640px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
select{font:inherit;color:inherit;background:#000;border:1px solid var(--line);border-radius:0;padding:4px 6px}
input[type=range]{flex:1 1 200px;accent-color:#e6e6e6}
.status{font-size:.9rem;min-height:1.6em}
.status b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.cell{background:none;border:1px solid transparent;padding:4px;text-align:left;cursor:pointer;text-shadow:none}
.cell:hover,.cell.current{border-color:var(--text)}
.cell > span{display:block;font-size:.78rem;color:var(--muted);margin-top:4px}
.cell > span b{color:var(--text)}
.mark{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Garden test</h1>
  <p>Every growth step of the garden. Each correct answer in the app shows one more step. <a href="./">Back to the app</a></p>

  <div class="live">
    <canvas id="live" role="img" aria-label="The garden at the chosen step"></canvas>
    <div class="controls">
      <button id="prev" aria-label="One step back">−1</button>
      <button id="next" class="primary">+1 grow</button>
      <button id="play">Play all</button>
      <button id="reset">Reset</button>
      <label>Head <select id="head"></select></label>
      <input type="range" id="slider" min="0" value="0" aria-label="Step">
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>

  <h2>All steps</h2>
  <p>Shown without motion. Tap a step to open it above.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const total = Garden.total;
const slider = $('#slider');
slider.max = total;

function milestone(n) {
  if (n === Garden.FULL_BLOOM) return ' (full bloom)';
  if (n === Garden.stepCount) return ' (meadow full)';
  if (n === total) return ' (last step)';
  return '';
}

const headSel = $('#head');
Garden.randomHeads.forEach(k => headSel.add(new Option(Garden.heads.find(h => h.key === k).name, k)));
const live = Garden.create($('#live'), n => {
  slider.value = n;
  $('#status').innerHTML = `Step <b>${n}</b> of ${total}: ${Garden.label(n, headSel.value)}${milestone(n)}`;
  document.querySelectorAll('.cell').forEach(c => c.classList.toggle('current', +c.dataset.n === n));
}, { head: Garden.randomHeads[0] });
headSel.value = live.head;
headSel.onchange = () => { live.setHead(headSel.value); drawThumbs(); };

let timer = null;
function stop() { clearInterval(timer); timer = null; $('#play').textContent = 'Play all'; }
$('#next').onclick = () => { stop(); if (live.count < total) live.grow(); };
$('#prev').onclick = () => { stop(); live.set(live.count - 1); };
$('#reset').onclick = () => { stop(); live.set(0); };
slider.oninput = () => { stop(); live.set(+slider.value); };
$('#play').onclick = () => {
  if (timer) return stop();
  if (live.count >= total) live.set(0);
  $('#play').textContent = 'Stop';
  timer = setInterval(() => live.count < total ? live.grow() : stop(), 600);
};
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') $('#next').click();
  if (e.key === 'ArrowLeft') $('#prev').click();
});

// Thumbnails of every step, drawn once without motion
const grid = $('#grid');
for (let n = 0; n <= total; n++) {
  const b = document.createElement('button');
  b.className = 'cell';
  b.dataset.n = n;
  const cv = document.createElement('canvas');
  cv.width = Garden.W; cv.height = Garden.H;
  const cap = document.createElement('span');
  b.append(cv, cap);
  b.onclick = () => { stop(); live.set(n); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  grid.append(b);
}
function drawThumbs() {
  document.querySelectorAll('.cell').forEach(b => {
    const n = +b.dataset.n;
    Garden.drawScene(b.querySelector('canvas').getContext('2d'), n, 0, { still: true, head: headSel.value });
    b.querySelector('span').innerHTML = `<b>${n}</b> ${Garden.label(n, headSel.value)}<span class="mark">${milestone(n)}</span>`;
  });
}
drawThumbs();
live.set(0);
</script>
</body>
</html>
